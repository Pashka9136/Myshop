{% load static %}

<!-- SERVICE BAR -->
<div class="service-bar">
    <div class="service-left">
        <a href="tel:+375291728401">+375 (25) 692-94-50 (Life)</a>
    </div>
</div>

<!-- MAIN HEADER -->
<div class="main-header">
    <div class="header-left">
        <a href="{% url 'shop:product_list' %}" class="logo">
            <!-- Логотип или название магазина -->
            <img src="{% static 'images/logo.png' %}" alt="Logo">
        </a>
    </div>

    <!-- Кнопка каталога -->
    <a href="{% url 'shop:catalog' %}" class="catalog-btn">Каталог</a>

    <!-- Форма поиска -->
    <form class="header-search" method="get" action="
        {% if category %}
            {% url 'shop:product_list_by_category' category.slug %}
        {% else %}
            {% url 'shop:catalog' %}
        {% endif %}
    ">
        <input type="text" name="q" value="{{ request.GET.q }}" placeholder="Поиск техники, брендов, моделей...">
        <button type="submit">
            <i class="bi bi-search"></i>
        </button>
    </form>

    <!-- Правая часть хедера -->
    <div class="header-right">
        <a href="{% url 'cart:cart_detail' %}" class="header-icon">
            <span class="icon">🛒</span>
            {% if cart %}
                <span class="cart-count">{{ cart|length }}</span>
            {% endif %}
            <span>Заказ</span>
        </a>
    </div>
</div>
